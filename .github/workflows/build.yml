name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version; omitted for development builds
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      MAVEN_OPTS: -Duser.language=en -Duser.country=US
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "27"
          cache: maven

      - name: Install Linux JavaFX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-0t64 libasound2t64 xvfb xauth

      - name: Set release version
        if: inputs.version != ''
        run: |
          [[ "$RELEASE_VERSION" =~ ^[1-9][0-9]*\.[0-9]+\.[0-9]+$ ]] || exit 1
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false

      - name: Build and test all modules
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            ./mvnw -B -ntp -DexcludedGroups=native-audio clean verify

      - name: Verify portable jDeploy editor bundle
        run: ./mvnw -B -ntp -Pjdeploy -pl animatorfx-editor -am package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore
          retention-days: 14
