<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <clipPath id="one">
    <rect x="10" y="10" width="50" height="50"/>
  </clipPath>
  <clipPath id="two" transform="translate(100 0)">
    <circle cx="20" cy="20" r="20"/>
    <path d="M0 40 h40 v40 h-40 z" transform="scale(0.5)"/>
    <rect width="5" height="5" display="none"/>
  </clipPath>
  <clipPath id="relative" clipPathUnits="objectBoundingBox">
    <rect width="0.5" height="0.5"/>
  </clipPath>
  <rect id="a" x="5" y="5" width="100" height="100" fill="red" clip-path="url(#one)" transform="translate(10 20)"/>
  <g id="b" clip-path="url(#two)">
    <rect width="200" height="200" fill="blue"/>
  </g>
  <circle id="c" cx="30" cy="30" r="30" style="clip-path: url('#one')"/>
  <rect id="d" width="10" height="10" clip-path="url(#relative)"/>
  <rect id="e" width="10" height="10" clip-path="url(#nowhere)"/>
</svg>
