<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="blue" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="window">
      <circle cx="50" cy="50" r="30"/>
    </clipPath>
    <filter id="blur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <g id="outer" transform="translate(20 10)" opacity="0.5">
    <g id="inner" transform="rotate(90) scale(2)">
      <rect id="box" x="10" y="5" width="40" height="20" fill="url(#sky)"/>
    </g>
    <rect id="clipped" width="100" height="100" fill="#00ff00" clip-path="url(#window)" filter="url(#blur)"/>
  </g>
</svg>
