<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="320"
     viewBox="0 0 480 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a4e"/>
      <stop offset="1" stop-color="#4f7bd9"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="0.6" stop-color="#ffc233"/>
      <stop offset="1" stop-color="#f08a00"/>
    </radialGradient>
    <linearGradient id="ribbon" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="390" y2="0">
      <stop offset="0" stop-color="#d7263d"/>
      <stop offset="1" stop-color="#f46036"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="20" y="20" width="440" height="280" rx="24"/>
    </clipPath>
    <path id="star" d="M0 -12 L3.5 -4 L12 -3.5 L5.5 2 L7.5 11 L0 6 L-7.5 11 L-5.5 2 L-12 -3.5 L-3.5 -4 Z"
          fill="#fff6c4"/>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <g id="scene" clip-path="url(#frame)">
    <rect id="background" width="480" height="320" fill="url(#sky)"/>
    <circle id="sunDisc" cx="360" cy="100" r="46" fill="url(#sun)"/>
    <g id="stars" opacity="0.9">
      <use xlink:href="#star" x="80" y="70"/>
      <use xlink:href="#star" x="150" y="46" transform="scale(0.7)"/>
      <use xlink:href="#star" x="230" y="84"/>
    </g>
    <path id="hills" d="M0 250 Q60 180 130 230 T260 220 T380 235 T480 205 V320 H0 Z" fill="#23395d"/>
    <path id="hillsFront" d="M0 290 C80 230 160 300 240 260 S400 240 480 280 V320 H0 Z" fill="#152238"/>
    <g id="flag" transform="translate(120 150) rotate(-8)">
      <line x1="0" y1="0" x2="0" y2="100" stroke="#e8e8e8" stroke-width="4" stroke-linecap="round"/>
      <polygon points="2,4 70,18 2,36" fill="#f46036" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
  <rect id="border" x="20" y="20" width="440" height="280" rx="24" fill="none" stroke="#ffffff" stroke-width="3"
        stroke-dasharray="12 6"/>
  <g id="banner" transform="translate(0 4)">
    <rect x="90" y="236" width="300" height="48" rx="10" fill="url(#ribbon)" filter="url(#soft)"/>
    <text id="caption" x="240" y="268" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold"
          fill="#ffffff">AnimatorFX</text>
  </g>
</svg>
